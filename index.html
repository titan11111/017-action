<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌆 サイバーパンク・ネオシティ・アクション</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    ::selection {
      background: transparent;
      color: inherit;
    }

    :root {
      --neon-cyan: #00ffff;
      --neon-pink: #ff00ff;
      --neon-yellow: #ffff00;
      --dark-bg: #0a0a0f;
      --cyber-dark: #1a1a2e;
      --cyber-blue: #0f3460;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
      font-family: 'Orbitron', monospace;
      color: #eee;
      position: fixed;
      inset: 0;
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
               0 env(safe-area-inset-left, 0px);
      box-sizing: border-box;
    }

    .cyber-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .cyber-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(to right, rgba(0, 255, 255, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.3;
      animation: gridFlow 30s linear infinite;
    }

    @keyframes gridFlow {
      from { transform: translate(0, 0); }
      to { transform: translate(50px, 50px); }
    }

    #gameContainer {
      position: relative;
      width: 800px;
      height: 600px;
      overflow: hidden;
      border: 3px solid var(--neon-cyan);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
      background-color: var(--cyber-dark);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #0a0a1a, #000);
    }

    #gameInfo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.7);
      border-bottom: 2px solid var(--neon-cyan);
      z-index: 5;
      font-size: 14px;
      color: var(--neon-cyan);
      font-weight: bold;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 255, 255, 0.1);
      padding: 5px 15px;
      border-radius: 20px;
      border: 1px solid var(--neon-cyan);
    }

    .info-value {
      color: var(--neon-yellow);
      font-size: 18px;
      text-shadow: 0 0 10px var(--neon-yellow);
    }

    #soundControls {
      display: flex;
      gap: 5px;
    }

    .sound-btn {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--neon-cyan);
      border-radius: 5px;
      color: var(--neon-cyan);
      padding: 5px 10px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sound-btn:hover {
      background: rgba(0, 255, 255, 0.2);
    }

    .sound-btn.muted {
      opacity: 0.5;
      border-color: #666;
      color: #666;
    }

    #mobileControls,
    #fcPad {
      display: none;
    }

    .fc-pad {
      background: linear-gradient(180deg, #3a3a48 0%, #1a1a28 100%);
      border-top: 3px solid #6a6a78;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.08);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      display: none;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 10;
      flex: 0 0 25%;
      min-height: 0;
      box-sizing: border-box;
    }

    .fc-dpad {
      width: min(42vw, 168px);
      height: min(42vw, 168px);
      display: grid;
      grid-template-columns: 1.15fr 1fr 1.15fr;
      grid-template-rows: 0.75fr 1.25fr 0.75fr;
      gap: 4px;
    }

    .fc-btn {
      border: none;
      border-radius: 0;
      background: #2a2a34;
      color: #c8c8d0;
      font-size: 1.35rem;
      font-family: inherit;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.1),
        0 4px 0 #111118;
      transition: transform 0.07s ease, background 0.07s ease, box-shadow 0.07s ease;
      touch-action: none;
      min-width: 48px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .fc-btn:disabled {
      opacity: 0.22;
      box-shadow: none;
      pointer-events: none;
    }

    .fc-btn:not(:disabled):active,
    .fc-btn.is-pressed {
      transform: translateY(3px) scale(0.95);
      background: #454556;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.55);
      color: #fff;
    }

    .fc-up { grid-column: 2; grid-row: 1; }
    .fc-left { grid-column: 1; grid-row: 2; font-size: 1.5rem; }
    .fc-center {
      grid-column: 2;
      grid-row: 2;
      background: #22222c;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    .fc-right { grid-column: 3; grid-row: 2; font-size: 1.5rem; }
    .fc-down { grid-column: 2; grid-row: 3; }

    .fc-actions {
      display: flex;
      gap: clamp(12px, 4vw, 22px);
      align-items: center;
      padding-top: 8px;
    }

    .fc-round {
      width: min(22vw, 84px);
      height: min(22vw, 84px);
      min-width: 64px;
      min-height: 64px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      font-family: inherit;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      box-shadow:
        0 6px 0 rgba(0, 0, 0, 0.45),
        inset 0 2px 0 rgba(255, 255, 255, 0.28);
      transition: transform 0.07s ease, box-shadow 0.07s ease;
      touch-action: none;
      line-height: 1.05;
      cursor: pointer;
    }

    .fc-round .fc-letter {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .fc-round small {
      font-size: 0.5rem;
      letter-spacing: 0.04em;
      opacity: 0.9;
    }

    .fc-a {
      background: radial-gradient(circle at 35% 30%, #ff8a80, #c62828 70%);
      transform: translateY(6px);
    }

    .fc-b {
      background: radial-gradient(circle at 35% 30%, #ffd54f, #f9a825 70%);
      color: #3a2800;
      text-shadow: none;
    }

    .fc-round:active,
    .fc-round.is-pressed {
      transform: translateY(5px) scale(0.93);
      box-shadow:
        0 2px 0 rgba(0, 0, 0, 0.45),
        inset 0 3px 8px rgba(0, 0, 0, 0.4);
    }

    .fc-a:active,
    .fc-a.is-pressed {
      transform: translateY(9px) scale(0.93);
    }

    #messageScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
    }

    .message-content {
      background: var(--cyber-dark);
      border: 3px solid var(--neon-pink);
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.7);
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    #messageTitle {
      font-size: 24px;
      margin-bottom: 20px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    #messageText {
      margin-bottom: 30px;
      color: #eee;
      line-height: 1.6;
      font-size: 14px;
    }

    .start-btn {
      background: var(--cyber-blue);
      color: #fff;
      border: 2px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.08s ease;
      box-shadow: 0 5px 15px rgba(0, 255, 255, 0.4);
      font-family: 'Orbitron', monospace;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 255, 255, 0.6);
    }

    .start-btn:active,
    .start-btn.is-pressed {
      transform: scale(0.92);
      opacity: 0.88;
    }

    .sound-btn:active,
    .sound-btn.is-pressed {
      transform: scale(0.92);
      opacity: 0.88;
    }

    #gameStage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      #gameContainer {
        width: 100vw;
        height: 100%;
        height: 100dvh;
        border: none;
        border-radius: 0;
        display: flex;
        flex-direction: column;
      }

      #gameStage {
        flex: 0 0 75%;
        width: 100%;
        height: 75%;
        min-height: 0;
      }

      #gameCanvas {
        width: 100%;
        height: 100%;
      }

      #gameInfo {
        font-size: 10px;
        padding: 5px 10px;
        flex-wrap: wrap;
        gap: 5px;
      }

      .info-item {
        padding: 3px 8px;
        font-size: 9px;
      }

      .info-value {
        font-size: 12px;
      }

      #soundControls {
        gap: 3px;
      }

      .sound-btn {
        padding: 3px 6px;
        font-size: 12px;
      }

      #fcPad {
        display: flex;
      }
    }

    @media (max-width: 768px) and (orientation: landscape) {
      #gameInfo { padding: 3px 8px; }
      .info-item { padding: 2px 6px; font-size: 8px; }
      .info-value { font-size: 10px; }

      .fc-dpad {
        width: min(28vw, 140px);
        height: min(28vw, 140px);
      }

      .fc-round {
        width: min(14vw, 68px);
        height: min(14vw, 68px);
        min-width: 56px;
        min-height: 56px;
      }
    }
  </style>
</head>
<body>
  <div class="cyber-bg">
    <div class="cyber-grid"></div>
  </div>

  <div id="gameContainer">
    <div id="gameStage">
      <div id="messageScreen">
        <div class="message-content">
          <h2 id="messageTitle">CYBER CITY ADVENTURE</h2>
          <p id="messageText">サイバーパンクの世界を冒険しよう！<br>10ステージ全クリアを目指せ！</p>
          <button type="button" id="messageButton" class="start-btn">START GAME</button>
        </div>
      </div>

      <div id="gameInfo">
        <div class="info-item">
          <span>STAGE</span>
          <span id="currentStage" class="info-value">1</span>
        </div>
        <div class="info-item">
          <span>LIFE</span>
          <span id="currentLife" class="info-value">3</span>
        </div>
        <div class="info-item">
          <span>SCORE</span>
          <span id="currentScore" class="info-value">0</span>
        </div>
        <div id="soundControls">
          <button type="button" id="bgmToggle" class="sound-btn" title="BGM">🎵</button>
          <button type="button" id="seToggle" class="sound-btn" title="効果音">🔊</button>
        </div>
      </div>

      <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <!-- 下25%: ファミコン風コントローラー（モバイル） -->
    <div class="fc-pad" id="fcPad" aria-label="ファミコンコントローラー">
      <div class="fc-dpad" aria-label="移動">
        <button type="button" class="fc-btn fc-up" id="padUp" aria-label="上" tabindex="-1" disabled></button>
        <button type="button" class="fc-btn fc-left" id="leftBtn" aria-label="左">◀</button>
        <button type="button" class="fc-btn fc-center" aria-hidden="true" tabindex="-1"></button>
        <button type="button" class="fc-btn fc-right" id="rightBtn" aria-label="右">▶</button>
        <button type="button" class="fc-btn fc-down" id="padDown" aria-label="下" tabindex="-1" disabled></button>
      </div>
      <div class="fc-actions">
        <button type="button" class="fc-round fc-b" id="padB" aria-label="B" tabindex="-1" disabled>
          <span class="fc-letter">B</span>
          <small>HOLD</small>
        </button>
        <button type="button" class="fc-round fc-a" id="jumpBtn" aria-label="ジャンプ">
          <span class="fc-letter">A</span>
          <small>JUMP</small>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ===== オーディオシステム（iOS対応・変更なし） =====
    const AudioSystem = {
      bgm: null,
      bgmBoss: null,
      currentBGM: null,
      bgmEnabled: true,
      seEnabled: true,
      volume: 0.5,
      audioContext: null,
      initialized: false,

      init: function() {
        if (this.initialized) return;
        this.bgm = new Audio('audio/Neon Circuitry.mp3');
        this.bgm.loop = true;
        this.bgm.volume = this.volume;
        this.bgmBoss = new Audio('audio/tobu.mp3');
        this.bgmBoss.loop = true;
        this.bgmBoss.volume = this.volume;
        this.initialized = true;
      },

      /**
       * iOS Safari のオーディオロック解除。
       * 必ずユーザー操作（click/touch）のハンドラ内から同期的に呼ぶこと。
       * ここを通さないと初回のBGM/SEが無音になる。
       */
      unlocked: false,

      unlock: function() {
        if (!this.audioContext) {
          this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.audioContext.state === 'suspended') this.audioContext.resume();
        // サイレントバッファを1回鳴らしてWebAudioのロックを外す
        try {
          const buf = this.audioContext.createBuffer(1, 1, 22050);
          const src = this.audioContext.createBufferSource();
          src.buffer = buf;
          src.connect(this.audioContext.destination);
          src.start(0);
        } catch (e) { /* unlock失敗は次のジェスチャで再試行 */ }

        // HTMLAudio は同一ジェスチャ内の playBGM() で許可される。
        // ここで play→pause すると非同期 pause が直後の BGM を止めるので行わない。
        if (this.bgm || this.bgmBoss) this.unlocked = true;
      },

      ensureResumed: function() {
        if (!this.audioContext) {
          this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.audioContext.state === 'suspended') {
          this.audioContext.resume().catch(() => {});
        }
        return this.audioContext;
      },

      playBGM: function(isBoss = false) {
        if (!this.bgmEnabled) return;
        this.ensureResumed();
        this.stopBGM();
        this.currentBGM = isBoss ? this.bgmBoss : this.bgm;
        if (this.currentBGM) {
          this.currentBGM.currentTime = 0;
          this.currentBGM.volume = this.volume;
          this.currentBGM.play().catch(() => { /* 未unlock時はここに落ちる。次のタップで再試行される */ });
        }
      },

      stopBGM: function() {
        if (this.currentBGM) {
          this.currentBGM.pause();
          this.currentBGM.currentTime = 0;
        }
      },

      pauseBGM: function() {
        if (this.currentBGM) this.currentBGM.pause();
      },

      resumeBGM: function() {
        if (this.bgmEnabled && this.currentBGM) {
          this.ensureResumed();
          this.currentBGM.play().catch(() => {});
        }
      },

      /** ボタン打感の「カチッ」音 */
      playClick: function() {
        if (!this.seEnabled) return;
        const ctx = this.ensureResumed();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.04);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      },

      playSE: function(type) {
        if (!this.seEnabled) return;
        const ctx = this.ensureResumed();
        const now = ctx.currentTime;

        switch(type) {
          case 'jump':
            this.playTone(ctx, 400, 0.1, 'square', now, 600);
            break;
          case 'coin':
            this.playTone(ctx, 800, 0.1, 'square', now);
            this.playTone(ctx, 1000, 0.1, 'square', now + 0.1);
            break;
          case 'heart':
            this.playTone(ctx, 600, 0.15, 'sine', now);
            this.playTone(ctx, 800, 0.15, 'sine', now + 0.1);
            this.playTone(ctx, 1000, 0.15, 'sine', now + 0.2);
            break;
          case 'powerup':
            for (let i = 0; i < 5; i++) {
              this.playTone(ctx, 400 + i * 100, 0.08, 'square', now + i * 0.05);
            }
            break;
          case 'hit':
            this.playNoise(ctx, 0.2, now);
            this.playTone(ctx, 150, 0.3, 'sawtooth', now);
            break;
          case 'clear':
            [523, 659, 784, 1047].forEach((f, i) => this.playTone(ctx, f, 0.2, 'square', now + i * 0.15));
            break;
          case 'gameover':
            this.playTone(ctx, 400, 0.3, 'sawtooth', now);
            this.playTone(ctx, 300, 0.3, 'sawtooth', now + 0.3);
            this.playTone(ctx, 200, 0.5, 'sawtooth', now + 0.6);
            break;
          case 'victory':
            [523, 659, 784, 659, 784, 1047].forEach((f, i) => this.playTone(ctx, f, 0.2, 'square', now + i * 0.12));
            break;
          case 'click':
            this.playClick();
            break;
        }
      },

      playTone: function(ctx, freq, duration, type, startTime, endFreq = null) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);
        if (endFreq) osc.frequency.linearRampToValueAtTime(endFreq, startTime + duration);
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
      },

      playNoise: function(ctx, duration, startTime) {
        const bufferSize = ctx.sampleRate * duration;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        const gain = ctx.createGain();
        noise.buffer = buffer;
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
        noise.connect(gain);
        gain.connect(ctx.destination);
        noise.start(startTime);
      },

      toggleBGM: function() {
        this.bgmEnabled = !this.bgmEnabled;
        this.bgmEnabled ? this.resumeBGM() : this.pauseBGM();
        return this.bgmEnabled;
      },

      toggleSE: function() {
        this.seEnabled = !this.seEnabled;
        return this.seEnabled;
      }
    };

    // ===== 画像読み込み（変更なし：ファイル名大文字小文字に注意！） =====
    const images = {
      player: new Image(),
      enemies: { rabbit: new Image(), ghost: new Image(), bomb: new Image(), fire: new Image(), boss: new Image() }
    };
    images.player.src = 'hero.png';
    images.enemies.rabbit.src = 'enemy8.png';
    images.enemies.ghost.src = 'enemy9.png';
    images.enemies.bomb.src = 'enemy10.png';
    images.enemies.fire.src = 'enemy7.png';
    images.enemies.boss.src = 'maou.png';
    
    const stageEnemyMapping = { 1:'rabbit', 2:'rabbit', 3:'ghost', 4:'ghost', 5:'bomb', 6:'bomb', 7:'fire', 8:'fire', 9:'fire', 10:'boss' };

    // ===== ゲーム設定 =====
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const messageScreen = document.getElementById('messageScreen');
    const messageTitle = document.getElementById('messageTitle');
    const messageText = document.getElementById('messageText');
    const messageButton = document.getElementById('messageButton');
    const currentStageSpan = document.getElementById('currentStage');
    const currentLifeSpan = document.getElementById('currentLife');
    const currentScoreSpan = document.getElementById('currentScore');

    let gameState = 'menu';
    let currentStage = 1;
    let playerLife = 3;
    let score = 0;
    let animationId = null;
    const keys = { left: false, right: false, space: false };

    const player = { x: 50, y: 200, width: 40, height: 40, velocityX: 0, velocityY: 0, speed: 5, jumpPower: 12, onGround: false, invulnerable: false, invulnerableTime: 0, color: '#00ff00' };
    const gravity = 0.5;
    const maxFallSpeed = 10;
    let platforms = [], enemies = [], items = [], particles = [];
    let goal = { x: 750, y: 100, width: 30, height: 40 };
    let powerUps = { speedBoost: { active: false, timer: 0 }, highJump: { active: false, timer: 0 }, shield: { active: false, timer: 0 } };

    let bgTick = 0;

    // ステージ背景テーマ（基調は中明度。装飾は低不透明度でプレイを邪魔しない）
    const stageBgThemes = {

    function drawStageBackground(stageIndex) {
      const theme = stageBgThemes[stageIndex] || stageBgThemes[1];
      const W = canvas.width;
      const H = canvas.height;
      const t = bgTick;

      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, theme.top);
      grad.addColorStop(1, theme.bottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      switch (theme.motif) {
        case 'grid': {
          ctx.strokeStyle = theme.accent;
          ctx.lineWidth = 1;
          for (let x = 0; x < W; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
          }
          for (let y = 0; y < H; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
          }
          break;
        }
        case 'city': {
          ctx.fillStyle = 'rgba(10,10,30,0.28)';
          const buildings = [40, 90, 70, 120, 55, 140, 80, 110, 60, 130, 75, 100];
          let bx = 0;
          buildings.forEach((h, i) => {
            const bw = 55 + (i % 3) * 10;
            ctx.fillRect(bx, H - h - 50, bw, h + 50);
            ctx.fillStyle = 'rgba(255,220,120,0.12)';
            for (let wy = H - h - 30; wy < H - 60; wy += 18) {
              for (let wx = bx + 8; wx < bx + bw - 8; wx += 14) {
                if ((wx + wy + Math.floor(t / 40)) % 3 !== 0) ctx.fillRect(wx, wy, 5, 7);
              }
            }
            ctx.fillStyle = 'rgba(10,10,30,0.28)';
            bx += bw + 8;
          });
          break;
        }
        case 'stream': {
          ctx.strokeStyle = theme.accent;
          ctx.lineWidth = 2;
          for (let i = 0; i < 14; i++) {
            const x = (i * 57 + t * 1.2) % (W + 40) - 20;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + 30, H);
            ctx.stroke();
          }
          break;
        }
        case 'matrix': {
          ctx.fillStyle = theme.accent;
          ctx.font = '11px monospace';
          for (let i = 0; i < 24; i++) {
            const x = (i * 34) % W;
            const y = (i * 97 + t * 2) % (H + 40) - 20;
            ctx.globalAlpha = 0.18;
            ctx.fillText(String((i * 7 + Math.floor(t / 8)) % 10), x, y);
          }
          ctx.globalAlpha = 1;
          break;
        }
        case 'core': {
          const cx = W * 0.5;
          const cy = H * 0.38;
          for (let r = 40; r <= 220; r += 36) {
            ctx.strokeStyle = theme.accent;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, r + Math.sin(t / 30 + r) * 4, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.fillStyle = 'rgba(255,160,255,0.08)';
          ctx.beginPath();
          ctx.arc(cx, cy, 28 + Math.sin(t / 20) * 6, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
        case 'void': {
          ctx.fillStyle = theme.accent;
          for (let i = 0; i < 40; i++) {
            const x = (i * 97) % W;
            const y = (i * 53) % H;
            const s = 1 + (i % 3);
            ctx.globalAlpha = 0.15 + ((Math.sin(t / 25 + i) + 1) * 0.08);
            ctx.fillRect(x, y, s, s);
          }
          ctx.globalAlpha = 1;
          break;
        }
        case 'nexus': {
          ctx.strokeStyle = theme.accent;
          ctx.lineWidth = 2;
          for (let i = 0; i < 8; i++) {
            const y = 80 + i * 60 + Math.sin(t / 35 + i) * 8;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y + (i % 2 === 0 ? 20 : -20));
            ctx.stroke();
          }
          break;
        }
        case 'quantum': {
          ctx.fillStyle = theme.accent;
          for (let i = 0; i < 28; i++) {
            const x = (i * 73 + Math.sin(t / 20 + i) * 20) % W;
            const y = (i * 41 + Math.cos(t / 25 + i) * 15) % H;
            ctx.globalAlpha = 0.16;
            ctx.beginPath();
            ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          break;
        }
        case 'storm': {
          ctx.strokeStyle = theme.accent;
          ctx.lineWidth = 2;
          if (Math.floor(t / 18) % 7 === 0) {
            ctx.globalAlpha = 0.35;
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.fillRect(0, 0, W, H);
          }
          for (let i = 0; i < 5; i++) {
            const x = 80 + i * 150 + Math.sin(t / 40 + i) * 30;
            ctx.globalAlpha = 0.18;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + 20, 80);
            ctx.lineTo(x - 10, 140);
            ctx.lineTo(x + 25, 220);
            ctx.lineTo(x, 320);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
          break;
        }
        case 'boss': {
          const cx = W * 0.5;
          const cy = H * 0.25;
          const glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, 280);
          glow.addColorStop(0, 'rgba(255,40,80,0.18)');

          ctx.fillStyle = glow;

          ctx.strokeStyle = theme.accent;
          ctx.lineWidth = 2;
          for (let i = 0; i < 6; i++) {

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(a) * 220, cy + Math.sin(a) * 160);
            ctx.stroke();
          }
          break;
        }
      }
      ctx.restore();
    }

        ...p,

        timer: p.timer || 0 
      }));
      enemies = stage.enemies.map(e => ({ ...e, startX: e.x, direction: 1, enemyType: stageIndex === 9 ? ['rabbit','ghost','bomb','fire'][Math.floor(Math.random()*4)] : stageEnemyMapping[stageIndex] }));

    function init() {
      // 選択・長押しメニュー・ドラッグ禁止
      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, { passive: false });
      document.addEventListener('selectstart', (e) => e.preventDefault());
      document.addEventListener('dragstart', (e) => e.preventDefault());
      document.addEventListener('dblclick', (e) => e.preventDefault());

      // ダブルタップズーム防止
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      document.addEventListener('touchmove', (e) => {
        if (e.target.closest('[data-scrollable]')) return;
        e.preventDefault();
      }, { passive: false });

      // アプリ復帰時に iOS の AudioContext / BGM を再開
      const resumeAudioOnReturn = () => {
        AudioSystem.ensureResumed();
        if (gameState === 'playing') AudioSystem.resumeBGM();
      };
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') resumeAudioOnReturn();
      });
      window.addEventListener('pageshow', resumeAudioOnReturn);
      window.addEventListener('focus', resumeAudioOnReturn);

      setupEventListeners();
      updateUI();
    }

    function bindHoldKey(el, keyName, opts = {}) {
      if (!el) return;
      const clickFeel = opts.clickFeel !== false;
      const press = (e) => {
        if (e && e.cancelable) e.preventDefault();
        if (e && e.pointerId != null && el.setPointerCapture) {
          try { el.setPointerCapture(e.pointerId); } catch (_) {}
        }
        el.classList.add('is-pressed');
        keys[keyName] = true;
        AudioSystem.unlock();
        if (clickFeel) {
          if (navigator.vibrate) navigator.vibrate(15);
          AudioSystem.playClick();
        }
      };
      const release = () => {
        el.classList.remove('is-pressed');
        keys[keyName] = false;
      };

      el.addEventListener('pointerdown', press);
      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);
      el.addEventListener('lostpointercapture', release);
    }

    function bindTap(el, handler) {
      if (!el) return;
      const fire = (e) => {
        if (e && e.cancelable) e.preventDefault();
        el.classList.add('is-pressed');
        if (navigator.vibrate) navigator.vibrate(15);
        AudioSystem.unlock();
        AudioSystem.playClick();
        handler(e);
      };
      const release = () => el.classList.remove('is-pressed');
      el.addEventListener('pointerdown', fire);
      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);
      el.addEventListener('pointerleave', release);
    }

    function setupEventListeners() {
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === ' ' || e.key === 'ArrowUp') { keys.space = true; e.preventDefault(); }
      });
      document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
        if (e.key === ' ' || e.key === 'ArrowUp') keys.space = false;
      });

      bindHoldKey(document.getElementById('leftBtn'), 'left');
      bindHoldKey(document.getElementById('rightBtn'), 'right');
      bindHoldKey(document.getElementById('jumpBtn'), 'space');

      bindTap(document.getElementById('bgmToggle'), function() {
        const enabled = AudioSystem.toggleBGM();
        const btn = document.getElementById('bgmToggle');
        btn.classList.toggle('muted', !enabled);
        btn.textContent = enabled ? '🎵' : '🔇';
      });
      bindTap(document.getElementById('seToggle'), function() {
        const enabled = AudioSystem.toggleSE();
        const btn = document.getElementById('seToggle');
        btn.classList.toggle('muted', !enabled);
        btn.textContent = enabled ? '🔊' : '🔈';
      });

      bindTap(messageButton, handleMessageButton);
    }

    function handleMessageButton() {
      // ユーザー操作の中でオーディオロックを外す（iOS Safari必須。init より先に呼ぶ）
      AudioSystem.init();
      AudioSystem.unlock();
      if (gameState === 'menu') startGame();
      else if (gameState === 'stageClear') nextStage();
      else if (gameState === 'gameOver' || gameState === 'gameComplete') resetGame();
    }

    function startGame() {
      if (animationId) cancelAnimationFrame(animationId);
      gameState = 'playing';
      currentStage = 1;
      playerLife = 3;
      score = 0;
      resetPlayer();
      loadStage(currentStage);
      hideMessage();
      updateUI();
      gameLoop();
    }function nextStage() { currentStage++; if (currentStage > 10) { gameComplete(); } else { gameState = 'playing'; resetPlayer(); loadStage(currentStage); hideMessage(); updateUI(); } }
    function resetGame() { gameState = 'menu'; currentStage = 1; playerLife = 3; score = 0; resetPlayer(); AudioSystem.stopBGM(); showMessage('CYBER CITY ADVENTURE', 'サイバーパンクの世界を冒険しよう！<br>10ステージ全クリアを目指せ！', 'START GAME'); updateUI(); }
    function resetPlayer() { player.x = 50; player.y = 200; player.velocityX = 0; player.velocityY = 0; player.onGround = false; player.invulnerable = false; player.invulnerableTime = 0; powerUps = { speedBoost: { active: false, timer: 0 }, highJump: { active: false, timer: 0 }, shield: { active: false, timer: 0 } }; }
    function updateUI() { currentStageSpan.textContent = currentStage; currentLifeSpan.textContent = playerLife; currentScoreSpan.textContent = score; }
    function showMessage(title, text, button) { messageTitle.textContent = title; messageText.innerHTML = text; messageButton.textContent = button; messageScreen.style.display = 'flex'; }
    function hideMessage() { messageScreen.style.display = 'none'; }
    function checkCollision(r1, r2) { return r1.x < r2.x + r2.width && r1.x + r1.width > r2.x && r1.y < r2.y + r2.height && r1.y + r1.height > r2.y; }

    function updatePlatforms() {
      platforms.forEach(p => {
        if (p.type === 'moving') {
          p.x += p.vx;
          if (p.x < p.minX || p.x > p.maxX) {
            p.vx *= -1;
          }
        }
        if (p.type === 'blinking') {
          p.timer++;
          if (p.timer >= 600) p.timer = 0;
          p.visible = p.timer < 300;
        }
      });
    }

    function updatePlayer() {
      let currentSpeed = powerUps.speedBoost.active ? player.speed * 1.5 : player.speed;
      if (keys.left) player.velocityX = -currentSpeed;
      else if (keys.right) player.velocityX = currentSpeed;
      else player.velocityX *= 0.8;

      let currentJumpPower = powerUps.highJump.active ? player.jumpPower * 1.3 : player.jumpPower;
      if (keys.space && player.onGround) { player.velocityY = -currentJumpPower; player.onGround = false; AudioSystem.playSE('jump'); }

      player.velocityY += gravity;
      if (player.velocityY > maxFallSpeed) player.velocityY = maxFallSpeed;
      player.x += player.velocityX;
      player.y += player.velocityY;
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
      if (player.y > canvas.height) loseLife();
      if (player.invulnerable) { player.invulnerableTime--; if (player.invulnerableTime <= 0) player.invulnerable = false; }
      Object.keys(powerUps).forEach(key => { if (powerUps[key].active) { powerUps[key].timer--; if (powerUps[key].timer <= 0) powerUps[key].active = false; } });
      
      player.onGround = false;
      platforms.forEach(platform => {
        if (platform.type === 'blinking' && !platform.visible) return;
        if (checkCollision(player, platform) && player.velocityY > 0 && player.y < platform.y) { 
          player.y = platform.y - player.height; 
          player.velocityY = 0; 
          player.onGround = true; 
          if (platform.type === 'moving') {
            player.x += platform.vx;
          }
        } 
      });
    }

    function updateEnemies() { enemies.forEach(enemy => { enemy.x += enemy.speed * enemy.direction; if (Math.abs(enemy.x - enemy.startX) > enemy.range) enemy.direction *= -1; if (!player.invulnerable && !powerUps.shield.active && checkCollision(player, enemy)) loseLife(); }); }

    function updateItems() { items = items.filter(item => { if (!item.collected && checkCollision(player, item)) { collectItem(item); return false; } return !item.collected; }); }

    function collectItem(item) {
      switch(item.type) {
        case 'coin': score += 100; createParticles(item.x + 10, item.y + 10, '#ffd700'); AudioSystem.playSE('coin'); break;
        case 'heart': if (playerLife < 5) playerLife++; score += 50; createParticles(item.x + 10, item.y + 10, '#ff69b4'); AudioSystem.playSE('heart'); break;
        case 'speedBoost': powerUps.speedBoost = { active: true, timer: 300 }; createParticles(item.x + 10, item.y + 10, '#00ffff'); AudioSystem.playSE('powerup'); break;
        case 'highJump': powerUps.highJump = { active: true, timer: 300 }; createParticles(item.x + 10, item.y + 10, '#ff00ff'); AudioSystem.playSE('powerup'); break;
        case 'shield': powerUps.shield = { active: true, timer: 300 }; createParticles(item.x + 10, item.y + 10, '#ffff00'); AudioSystem.playSE('powerup'); break;
      }
      updateUI();
    }

    function loseLife() {
      if (player.invulnerable || powerUps.shield.active) return;
      playerLife--; updateUI(); AudioSystem.playSE('hit');
      if (playerLife <= 0) gameOver();
      else { player.invulnerable = true; player.invulnerableTime = 120; resetPlayer(); loadStage(currentStage); createParticles(player.x + player.width/2, player.y + player.height/2, '#ff0000'); }
    }

    function checkGoal() { if (checkCollision(player, goal)) stageClear(); }
    function stageClear() { gameState = 'stageClear'; score += 500; updateUI(); AudioSystem.stopBGM(); AudioSystem.playSE('clear'); showMessage(`STAGE ${currentStage} CLEAR!`, `スコア: ${score}<br>残りライフ: ${playerLife}`, 'NEXT STAGE'); }
    function gameOver() { gameState = 'gameOver'; AudioSystem.stopBGM(); AudioSystem.playSE('gameover'); showMessage('GAME OVER', `最終スコア: ${score}<br>到達ステージ: ${currentStage}`, 'RETRY'); }
    function gameComplete() { gameState = 'gameComplete'; score += 1000; updateUI(); AudioSystem.stopBGM(); AudioSystem.playSE('victory'); showMessage('CONGRATULATIONS!', `全ステージクリア！<br>最終スコア: ${score}`, 'PLAY AGAIN'); }

    function createParticles(x, y, color) { for (let i = 0; i < 8; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 30, color }); }
    function updateParticles() { particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--; return p.life > 0; }); }

    function draw() {
      bgTick++;
      drawStageBackground(currentStage);

      platforms.forEach(p => {
        if (p.type === 'blinking' && !p.visible) return;
        if (p.type === 'moving') {
           ctx.fillStyle = '#ff00ff';
           ctx.strokeStyle = '#ff88ff';
        } else if (p.type === 'blinking') {
           const timeLeft = 300 - p.timer;
           if (timeLeft < 60 && Math.floor(Date.now() / 50) % 2 === 0) {
             ctx.fillStyle = 'rgba(0, 255, 136, 0.3)';
           } else {
             ctx.fillStyle = '#00ff88'; 
           }
           ctx.strokeStyle = '#00ffaa';
        } else {
           ctx.fillStyle = '#00ff88';
           ctx.strokeStyle = '#00ffaa';
        }
        ctx.fillRect(p.x, p.y, p.width, p.height);
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.width, p.height);
      });

      items.forEach(item => {
        if (item.collected) return;
        switch(item.type) {
          case 'coin': ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(item.x + 10, item.y + 10, 8, 0, Math.PI * 2); ctx.fill(); break;
          case 'heart': ctx.fillStyle = '#ff69b4'; ctx.fillRect(item.x, item.y, 20, 20); break;
          case 'speedBoost': ctx.fillStyle = '#00ffff'; ctx.fillRect(item.x + 5, item.y, 10, 20); ctx.fillRect(item.x, item.y + 7, 20, 6); break;
          case 'highJump': ctx.fillStyle = '#ff00ff'; ctx.beginPath(); ctx.moveTo(item.x + 10, item.y); ctx.lineTo(item.x + 20, item.y + 20); ctx.lineTo(item.x, item.y + 20); ctx.closePath(); ctx.fill(); break;
          case 'shield': ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(item.x + 10, item.y + 10, 10, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 2; ctx.stroke(); break;
        }
      });

      enemies.forEach(enemy => {
        const img = images.enemies[enemy.enemyType || stageEnemyMapping[currentStage]];
        if (img && img.complete && img.naturalWidth > 0) ctx.drawImage(img, enemy.x, enemy.y, enemy.width, enemy.height);
        else { ctx.fillStyle = enemy.isBoss ? '#800080' : '#ff4444'; ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height); ctx.fillStyle = '#fff'; ctx.fillRect(enemy.x + enemy.width * 0.15, enemy.y + enemy.height * 0.2, enemy.width * 0.2, enemy.width * 0.15); ctx.fillRect(enemy.x + enemy.width * 0.65, enemy.y + enemy.height * 0.2, enemy.width * 0.2, enemy.width * 0.15); }
      });

      ctx.fillStyle = '#ffff00'; ctx.fillRect(goal.x, goal.y, goal.width, goal.height); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(goal.x, goal.y, goal.width, goal.height); ctx.fillStyle = '#fff'; ctx.font = '20px Arial'; ctx.fillText('★', goal.x + 5, goal.y + 28);

      if (!player.invulnerable || Math.floor(player.invulnerableTime / 5) % 2 === 0) {
        if (images.player.complete && images.player.naturalWidth > 0) ctx.drawImage(images.player, player.x, player.y, player.width, player.height);
        else { ctx.fillStyle = player.color; ctx.fillRect(player.x, player.y, player.width, player.height); }
        if (powerUps.shield.active) { ctx.strokeStyle = 'rgba(255, 255, 0, 0.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(player.x + player.width/2, player.y + player.height/2, 25, 0, Math.PI * 2); ctx.stroke(); }
      }

      particles.forEach(p => { ctx.globalAlpha = p.life / 30; ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
      ctx.globalAlpha = 1;

      let hudY = 70; ctx.font = '12px Orbitron';
      if (powerUps.speedBoost.active) { ctx.fillStyle = '#00ffff'; ctx.fillText(`SPEED: ${Math.ceil(powerUps.speedBoost.timer / 60)}s`, 10, hudY); hudY += 20; }
      if (powerUps.highJump.active) { ctx.fillStyle = '#ff00ff'; ctx.fillText(`JUMP: ${Math.ceil(powerUps.highJump.timer / 60)}s`, 10, hudY); hudY += 20; }
      if (powerUps.shield.active) { ctx.fillStyle = '#ffff00'; ctx.fillText(`SHIELD: ${Math.ceil(powerUps.shield.timer / 60)}s`, 10, hudY); }
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.font = '10px Orbitron'; ctx.fillText(stageData[currentStage - 1].name, canvas.width - 150, 70);
    }

    function gameLoop() { 
      if (gameState === 'playing') { 
        updatePlatforms(); 
        updatePlayer(); 
        updateEnemies(); 
        updateItems(); 
        updateParticles(); 
        checkGoal(); 
        draw(); 
      } 
      animationId = requestAnimationFrame(gameLoop); 
    }

    init();
  </script>
</body>
